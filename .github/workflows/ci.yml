name: ci

# Run on every push to main, and on every pull request.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      # Without this, GitHub cancels the other job as soon as one fails. We want
      # both results, so we can tell whether a failure is platform specific.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      # Reading the version from go.mod means CI and the developer machine
      # cannot drift apart.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...

  # Formatting is a separate job: it is fast, and a style problem is a different
  # kind of problem from a broken test.
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not formatted. Run: gofmt -w ."
            echo "$unformatted"
            exit 1
          fi
